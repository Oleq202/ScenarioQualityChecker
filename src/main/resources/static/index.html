<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenario Quality Checker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; color: #333;}
        h1, h2, h3 { color: #2c3e50; }

        .section-box { border: 1px solid #ccc; padding: 15px; margin: 15px 0; background: #f9f9f9; border-radius: 5px;}
        .scenario-box { border: 1px solid #ccc; padding: 15px; margin: 10px 0; background: #fff; border-radius: 5px;}
        .subscenario-box { border: 1px solid #007bff; padding: 10px; margin-top: 10px; margin-left: 20px; background: #e9f5ff; border-radius: 5px;}
        .step-box { margin-left: 20px; margin-top: 5px; }

        .controls { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc;}
        input[type="text"] { width: 60%; padding: 6px; border: 1px solid #ccc; border-radius: 3px;}
        select { padding: 6px; border-radius: 3px; }

        button { padding: 6px 12px; margin-right: 5px; margin-bottom: 5px; cursor: pointer; background: #e0e0e0; border: 1px solid #aaa; border-radius: 3px;}
        button:hover { background: #d0d0d0; }
        .delete-btn { background: #ffcccc; color: #cc0000; border-color: #ff9999; font-weight: bold;}
        .delete-btn:hover { background: #ff9999; }
        .action-btn { background: #4CAF50; color: white; border-color: #388E3C; font-weight: bold;}
        .action-btn:hover { background: #45a049; }

        #outputArea { background: #2b2b2b; color: #a9b7c6; padding: 15px; border-radius: 5px; overflow-x: auto; font-family: monospace; min-height: 100px;}
    </style>
</head>
<body>
<h1>Scenario Quality Checker</h1>

<div class="section-box">
    <h3>1. File Operations</h3>
    <input type="file" id="fileInput" accept=".json">
    <button onclick="loadScenario()">Load Scenario</button>
    <button onclick="downloadScenario()" style="margin-left: 15px;">Download as JSON</button>
</div>

<div class="section-box">
    <h3>2. Edit Scenario Metadata</h3>
    <label>Title: <input type="text" id="title" value="Book addition"></label><br><br>
    <label>System Actor: <input type="text" id="systemActor" value="System"></label><br><br>
    <label>Actors (comma separated): <input type="text" id="actors" value="Librarian"></label>
</div>

<div class="section-box">
    <h3>3. Scenario Steps</h3>
    <div id="editor-root" class="scenario-box">
    </div>
    <button onclick="addNode(document.getElementById('editor-root'), 'STEP')">+ Add Step</button>
    <button onclick="addNode(document.getElementById('editor-root'), 'SUBSCENARIO')">+ Add Subscenario</button>
</div>

<div class="section-box">
    <h3>4. Analyze</h3>
    <button class="action-btn" onclick="analyze('/api/steps_count')">Count Steps</button>
    <button class="action-btn" onclick="analyze('/api/keywords_count')">Count Keywords</button>
    <button class="action-btn" onclick="analyze('/api/invalid_steps')">Find Invalid Steps</button>
    <button class="action-btn" onclick="analyze('/api/get_numbered_steps')">Get Numbered Steps</button>
    <button class="action-btn" onclick="analyze('/api/get_simplified_scenario?depth=' + prompt('Enter maximum depth:', '1'))">Get Simplified Scenario</button>
</div>

<div class="section-box">
    <h3>5. Output</h3>
    <pre id="outputArea">Awaiting action...</pre>
</div>

<script src="app.js"></script>
</body>
</html>
